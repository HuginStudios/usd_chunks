[pytest]
norecursedirs = _installed_deps

# tests/test_new_chunks.py imports example chunks as `scripts.examples.*`, and scripts/
# is not an installed package. Running `python -m pytest` happens to put the repo root
# on sys.path; the bare `pytest` console script does not. Setting it here makes the
# suite behave the same either way.
pythonpath = .

# Run the suite across all cores. Nearly every test builds its own stage, registry scene
# and widgets in-process, so the singletons they share are per-worker here -- there is no
# state to serialise on. Pass -n0 for a single process when a failure needs a readable
# order or a debugger.
#
# loadfile, not the default per-test distribution: a file's tests share module-scoped
# fixtures and, in places, a deliberate order (test_copy_paste's last test documents why
# it must run last). Whole files go to one worker, so that order is preserved.
addopts = -n auto --dist loadfile

# `slow` is for tests that shell out and take tens of seconds -- creating a venv and
# running pip, in test_pin. They run by default because a marker nobody exercises stops
# being true; `-m "not slow"` skips them when iterating.
markers =
    slow: shells out to pip or a venv; tens of seconds
