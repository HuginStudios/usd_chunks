[pytest]
norecursedirs = _installed_deps

# tests/test_new_chunks.py imports example chunks as `scripts.examples.*`, and scripts/
# is not an installed package. Running `python -m pytest` happens to put the repo root
# on sys.path; the bare `pytest` console script does not. Setting it here makes the
# suite behave the same either way.
pythonpath = .

# `slow` is for tests that shell out and take tens of seconds -- creating a venv and
# running pip, in test_pin. They run by default because a marker nobody exercises stops
# being true; `-m "not slow"` skips them when iterating.
markers =
    slow: shells out to pip or a venv; tens of seconds
