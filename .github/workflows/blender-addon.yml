name: Blender add-on

# One zip a Blender user installs with Install from Disk, and nothing else to set up:
# the add-on with usd_chunks (chunks included) inside it as a wheel. Built by
# tools/build_blender_addon.py, which says what is in it and why.
#
# Run by hand from the Actions tab, to try a build before a release. The zip is kept as a
# workflow artifact. On a v* tag, the Release workflow (release.yml) builds it too and
# attaches it to the release.

on:
  workflow_dispatch:

jobs:
  build:
    # Linux: the build is pure Python and needs neither Blender nor OpenUSD, and Linux
    # runners cost half what Windows ones do.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build the add-on zip
        run: python tools/build_blender_addon.py --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: usd_chunks_blender
          path: dist/usd_chunks_blender-*.zip
          if-no-files-found: error
