name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Build only, for now: the site is published to our own web root via
# `build_docs.bat --share`, not from here. To publish from CI later, add a deploy job
# using actions/upload-pages-artifact + actions/deploy-pages, and set the repository's
# Pages source to "GitHub Actions".
#
# Since nothing is deployed, a superseded run is pure waste and can be cancelled.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # mkdocs-git-revision-date-localized reads each page's history, and the
          # config sets fallback_to_build_date: false — a shallow clone makes it fail.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The docs are generated from the source: mkdocstrings + griffe_chunks.py
      # introspect usd_chunks, so the package has to be importable, not just present.
      - run: pip install -e ".[docs]"

      # Deliberately not --strict. Strict promotes warnings to failures, and griffe
      # currently emits five for undocumented return values (chunk.py and chunk_notice.py),
      # so it would fail on arrival. Worth turning on once those are annotated -- it is
      # what would catch a broken cross-reference or an unreachable inventory.
      - name: Build
        env:
          USD_CHUNK_DIRS: scripts
        run: python -m mkdocs build --site-dir _site

      # Downloadable from the run, so a build can be inspected without reproducing the
      # environment locally.
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: _site
