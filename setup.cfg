[metadata]
name = usd_chunks
version = 0.0.1
description = "UI and execution interface for OpenUSD"
classifiers =
    "Programming Language :: Python :: 3"
    "Operating System :: OS Independent"

[options]
packages = 
    usd_chunks
    plugins
python_requires = >=3.9
install_requires =
    attrs>=24.0.0
    typing-extensions

[options.entry_points]
console_scripts =
    usdchunks = plugins.usdchunks_cli:main
