# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Same as Black.
line-length = 120
indent-width = 4

# Matches requires-python in pyproject.toml.
target-version = "py310"

[lint]
# Pyflakes (`F`) and a subset of pycodestyle (`E`), plus the house style:
#   UP    -- modern syntax for the target version: `X | None`, builtin generics, f-strings
#   G004  -- logging calls take %-style args, never an f-string, so formatting stays lazy
#   I002  -- every module starts with `from __future__ import annotations`
#   D     -- Google-style docstrings (see [lint.pydocstyle]); __init__ is documented in
#            its class docstring, which mkdocs merges, so D107 is off
select = ["E4", "E7", "E9", "F", "UP", "G004", "I002", "D"]
ignore = ["D107"]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[lint.isort]
required-imports = ["from __future__ import annotations"]

[lint.pydocstyle]
convention = "google"

[lint.per-file-ignores]
# Test docstrings describe behaviour rather than an API, and the chunk modules in
# scripts/ are not converted yet.
"tests/**" = ["D"]
"scripts/**" = ["D"]

[format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = true

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = 60

