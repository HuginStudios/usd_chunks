schema_version = "1.0.0"

id = "usd_chunks"
version = "0.1.0"
name = "USDChunks Editor"
tagline = "Author OpenUSD composition as a node graph"
maintainer = "Hugin Studios <info@huginstudios.com>"
type = "add-on"

website = "https://github.com/HuginStudios/usd_chunks"
tags = ["Pipeline", "Import-Export", "Node"]

blender_version_min = "4.2.0"
license = ["SPDX:Apache-2.0"]

# No `wheels` entry in this copy. tools/build_blender_addon.py, which the release workflow
# runs on every v* tag, adds one for the usd_chunks wheel it bundles; this folder built
# as-is (`blender --command extension build`, docs/blender.md) is the add-on for a usd_chunks
# installed into Blender separately.
#
# usd_chunks needs `attrs`, `typing-extensions` and the OpenUSD Python bindings. Blender
# ships all three. The bindings must NEVER be bundled: Blender's are compiled under a
# private namespace (pxrBlender_v26_03__pxrReserved__), so a pip `usd-core` beside them is
# a different C++ type and cannot exchange objects with Blender's USD. Shipping it would not
# conflict -- it would quietly give the add-on a second, unrelated USD.
#
# wheels = ["./wheels/usd_chunks-*.whl"]

[permissions]
files = "Read and write .usda chunk networks chosen by the user"
network = "Install the Python packages a chunk needs, when you agree to it"
