schema_version = "1.0.0"

id = "usd_chunks"
version = "0.1.0"
name = "USDChunks Editor"
tagline = "Author OpenUSD composition as a node graph"
maintainer = "Hugin Studios <info@huginstudios.com>"
type = "add-on"

website = "https://github.com/HuginStudios/usd_chunks"
tags = ["Pipeline", "Import-Export", "Node"]

blender_version_min = "4.2.0"
license = ["SPDX:Apache-2.0"]

# No `wheels` entry, and that is a decision rather than an omission.
#
# usd_chunks needs `attrs`, `typing-extensions` and the OpenUSD Python bindings. The first
# two are ordinary wheels and belong here once this is published. The bindings must NOT be:
# Blender already ships them, compiled under a private namespace
# (pxrBlender_v26_03__pxrReserved__), so a pip `usd-core` installed beside them is a
# different C++ type and cannot exchange objects with Blender's USD. Shipping it would not
# conflict -- it would quietly give the add-on a second, unrelated USD.
#
# Until the wheels are built, install into Blender's own Python:
#   <blender>/<version>/python/bin/python -m pip install /path/to/usd_chunks
# which resolves attrs and typing-extensions and leaves the bindings alone.
#
# wheels = ["./wheels/attrs-*.whl", "./wheels/typing_extensions-*.whl"]

[permissions]
files = "Read and write .usda chunk networks chosen by the user"
