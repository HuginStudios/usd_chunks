[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "usd-chunks"
version = "0.1.0"
description = "UI and execution interface for OpenUSD"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Hugin Studios", email = "info@huginstudios.com" }]
keywords = ["usd", "openusd", "usdview", "vfx", "pipeline"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = [
    "attrs>=25.4.0",
    "typing-extensions",
]

[project.urls]
Homepage = "https://github.com/HuginStudios/usd_chunks"
Repository = "https://github.com/HuginStudios/usd_chunks"
Issues = "https://github.com/HuginStudios/usd_chunks/issues"

[project.optional-dependencies]
# OpenUSD itself, for running outside a DCC. Deliberately NOT a hard dependency: every
# host worth embedding in already ships USD, and installing a second one beside the
# host's is worse than redundant. Hosts compile USD under a private namespace -- Blender's
# is pxrBlender_v26_03__pxrReserved__, verified against bpy 5.2.1 -- so objects from a pip
# usd-core are a different C++ type entirely and cannot be handed to the host's USD. That
# is two unrelated USDs in one process, not one shared. Houdini and Maya do the same.
# So: standalone gets usd-core, a DCC gets the host's pxr, and never both.
standalone = ["usd-core"]
# For hosts that do not already supply Qt. usdview and Houdini bring their own.
ui = ["PySide6"]
# The standalone graph frontends. Neither is imported unless you ask for its module by
# name -- frontends/__init__.py imports nothing -- so a missing toolkit is not fatal to the
# rest of the package, but `usdchunks-flet`/`-imgui` need these.
flet = ["flet>=0.28"]
imgui = ["imgui-bundle>=1.6"]
# `requests` is not a library dependency — the suite loads example chunks from chunks/
# that import it. Chunks whose imports fail are skipped by the registry, so the heavier
# example deps (numpy, opencv) are deliberately left out.
dev = ["pytest", "pytest-xdist", "ruff", "build", "types-usd", "requests", "usd-core",
       "flet>=0.28", "imgui-bundle>=1.6"]
docs = [
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings-python",
    "markdown-include",
    "griffe-fieldz",
    "mkdocs_gen_files",
    "mkdocs-git-committers-plugin",
    "mkdocs-git-revision-date-localized-plugin",
]

[project.scripts]
usdchunks = "usd_chunks.cli:main"

[tool.setuptools.packages.find]
include = ["usd_chunks*"]
namespaces = false

[tool.setuptools.package-data]
"usd_chunks" = ["resources/icons/*.png"]
"usd_chunks.hosts.usdview" = ["plugInfo.json"]
